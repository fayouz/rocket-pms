parameters:
    env(UPDATE_REPOSITORY): 'fayouz/rocket-pms'
    env(LODGIFY_API_KEY): ''
    env(NUKI_API_TOKEN): ''
    env(PMS_TIMEZONE): 'Europe/Paris'
    env(ROCKET_CLOUD_URL): ''
    env(ROCKET_CLOUD_TOKEN): ''

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            $lodgifyApiKey: '%env(LODGIFY_API_KEY)%'
            $nukiApiToken: '%env(NUKI_API_TOKEN)%'
            $timezone: '%env(PMS_TIMEZONE)%'
            $cloudUrl: '%env(ROCKET_CLOUD_URL)%'
            $cloudToken: '%env(ROCKET_CLOUD_TOKEN)%'
            $storagePath: '%kernel.project_dir%/var/demo-cloud.json'

    App\:
        resource: '../src/'

when@test:
    services:
        App\Tests\Support\HttpMock: ~
