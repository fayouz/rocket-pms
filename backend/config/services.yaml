parameters:
    env(UPDATE_REPOSITORY): 'fayouz/rocket-pms'
    env(PMS_TIMEZONE): 'Europe/Paris'
    env(ROCKET_PLACE_URL): ''
    env(ROCKET_PLACE_FRONT_URL): ''
    env(ROCKET_CLEAN_URL): ''
    env(ROCKET_STOCK_URL): ''
    env(ROCKET_CAST_FRONT_URL): ''
    env(ROCKET_MAILER_URL): ''
    env(ROCKET_MAILER_INBOX): ''
    env(ROCKET_MAILER_MAILBOX): ''

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            # Keys and tokens read at call time from the secrets vault (App\Secrets\IntegrationSecrets).
            $lodgifyApiKey: '@App\Secrets\IntegrationSecrets'
            $timezone: '%env(PMS_TIMEZONE)%'
            $placeUrl: '%env(ROCKET_PLACE_URL)%'
            $placeToken: '@App\Secrets\IntegrationSecrets'
            $cleanUrl: '%env(ROCKET_CLEAN_URL)%'
            $cleanToken: '@App\Secrets\IntegrationSecrets'
            $stockUrl: '%env(ROCKET_STOCK_URL)%'
            $stockToken: '@App\Secrets\IntegrationSecrets'
            $mailerUrl: '%env(ROCKET_MAILER_URL)%'
            $mailerToken: '@App\Secrets\IntegrationSecrets'
            $mailerInbox: '%env(ROCKET_MAILER_INBOX)%'
            $mailerMailbox: '%env(ROCKET_MAILER_MAILBOX)%'
            $demoMailerPath: '%kernel.project_dir%/var/demo-mailer-%kernel.environment%.json'
            $demoPlacePath: '%kernel.project_dir%/var/demo-place-%kernel.environment%.json'

    App\:
        resource: '../src/'

when@test:
    services:
        App\Tests\Support\HttpMock: ~
